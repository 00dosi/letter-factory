<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#fff6ef;">
<span style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fff6ef;">
  <tr>
    <td align="center" style="padding:24px 10px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:18px;">
        <tr>
          <td style="padding:0;font-size:0;line-height:0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
              <td width="34%" style="height:10px;background:{{ accent }};border-top-left-radius:18px;">&nbsp;</td>
              <td width="33%" style="height:10px;background:{{ accent2 }};">&nbsp;</td>
              <td width="33%" style="height:10px;background:#f2b705;border-top-right-radius:18px;">&nbsp;</td>
            </tr></table>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 30px 10px;font-family:{{ font }};">
            {% if logo_url %}<img src="{{ logo_url }}" alt="{{ org_name }}" height="32" style="display:block;height:32px;border:0;margin:0 0 16px;">{% endif %}
            <span style="display:inline-block;padding:4px 12px;border-radius:999px;background:#fff0e0;font-size:12px;font-weight:700;color:{{ deep }};">{{ issue_label }}{% if issue_label %} · {% endif %}{{ date_label }}</span>
            <h1 style="margin:14px 0 0;font-size:27px;line-height:1.35;font-weight:800;color:#1f2933;">{{ title }}</h1>
          </td>
        </tr>
        {% for row in blocks %}{{ row }}
        {% endfor %}
        <tr>
          <td style="padding:20px 30px 28px;font-family:{{ font }};font-size:12px;line-height:1.7;color:#8a8f98;">{{ footer }}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
