<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<span style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ preheader }}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
  <tr>
    <td align="center" style="padding:28px 8px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;">
        <tr>
          <td style="padding:12px 40px 26px;border-bottom:1px solid #e5e7eb;font-family:{{ font }};">
            {% if logo_url %}<img src="{{ logo_url }}" alt="{{ org_name }}" height="28" style="display:block;height:28px;border:0;margin:0 0 22px;">{% endif %}
            <div style="font-size:12px;letter-spacing:0.5px;color:#9ca3af;">{{ issue_label }}{% if issue_label %}  ·  {% endif %}{{ date_label }}</div>
            <h1 style="margin:10px 0 0;font-size:28px;line-height:1.35;font-weight:700;color:#111827;">{{ title }}</h1>
          </td>
        </tr>
        {% for row in blocks %}{{ row }}
        {% endfor %}
        <tr>
          <td style="padding:26px 40px 10px;border-top:1px solid #e5e7eb;font-family:{{ font }};font-size:12px;line-height:1.7;color:#9ca3af;">{{ footer }}</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
